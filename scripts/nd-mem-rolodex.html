<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ND-Mem Rolodex</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--border:#d4d1ca;--text:#28251d;--muted:#7a7974;--faint:#8d8c86;--primary:#01696f;--cardW:340px;--cardH:230px;--font-display:'Clash Display','Inter',sans-serif;--font-body:'Satoshi','Inter',sans-serif;--surface:rgba(255,255,255,.75);--surfaceBorder:rgba(0,0,0,.12);--bgEnd:#efece6;--overlayBg:rgba(250,249,246,.96);--cardWash:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.3))}
    [data-theme="dark"]{--bg:#111318;--border:#37404b;--text:#edf2f4;--muted:#a3b0b8;--faint:#6e7a84;--primary:#60d7d2;--surface:rgba(16,20,24,.72);--surfaceBorder:rgba(255,255,255,.1);--bgEnd:#0d0f13;--overlayBg:rgba(20,24,29,.96);--cardWash:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03))}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    body{font-family:var(--font-body);color:var(--text);background:radial-gradient(circle at top left,rgba(96,215,210,.1),transparent 24%),linear-gradient(180deg,var(--bg),var(--bgEnd));user-select:none}
    button{font:inherit;color:inherit;cursor:pointer}
    #chrome{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;pointer-events:none}
    #chrome .cluster{display:flex;gap:10px;align-items:center;pointer-events:auto}
    .pill{padding:9px 14px;border-radius:999px;border:1px solid var(--surfaceBorder);background:var(--surface);backdrop-filter:blur(10px);font-size:.82rem;color:var(--muted)}
    .pill strong{color:var(--text);font-weight:500}
    a.pill{text-decoration:none}
    #backBtn{font-size:1rem;line-height:1}
    #levelName{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.14em;font-size:.74rem}
    #crumb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;letter-spacing:.02em;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #crumb .seg{background:none;border:0;padding:0 2px;font:inherit;color:var(--muted);cursor:pointer;border-radius:4px}
    #crumb .seg:hover{color:var(--text);background:rgba(96,215,210,.14)}
    #crumb .seg.depth{color:var(--primary);font-weight:600}
    #crumb .seg.leaf,#crumb .seg:disabled{color:var(--text);cursor:default}
    #crumb .seg:disabled:hover{background:none}
    #crumb .sep{color:var(--faint);padding:0 1px}
    #stage{position:fixed;inset:0;perspective:1400px;overflow:hidden;touch-action:none}
    #stage.bounce::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(96,215,210,.35);animation:edgeflash .45s ease}
    @keyframes edgeflash{from{opacity:1}to{opacity:0}}
    #scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .55s ease}
    #scene.zoom-in{transform:translateZ(900px);opacity:0}
    #scene.zoom-out{transform:translateZ(-700px) scale(.6);opacity:0}
    #scene.bouncing{animation:wallbounce .45s ease}
    @keyframes wallbounce{0%{transform:translateZ(0)}35%{transform:translateZ(-90px)}100%{transform:translateZ(0)}}
    #drum{position:relative;width:var(--cardW);height:var(--cardH);transform-style:preserve-3d}
    #stage[data-level="memories"]{--cardH:500px}
    .card3d{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;border:1px solid var(--surfaceBorder);background:var(--cardWash),radial-gradient(circle at top right,rgba(96,215,210,.16),transparent 38%),var(--surface);box-shadow:0 18px 40px rgba(0,0,0,.35);backface-visibility:hidden;transition:opacity .3s,box-shadow .3s,border-color .3s;opacity:.55}
    .card3d.front{opacity:1;border-color:rgba(96,215,210,.4);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 30px rgba(96,215,210,.12)}
    .card3d .kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
    .card3d h2{font-family:var(--font-display);font-size:1.15rem;line-height:1.2}
    .card3d p{color:var(--muted);line-height:1.5;font-size:.9rem;overflow:hidden}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--surfaceBorder);font-size:.74rem;color:var(--muted)}
    .card3d .reader-scroll{display:none;flex:1;min-height:0;overflow:auto;padding-right:6px;line-height:1.6;color:var(--text);font-size:.92rem;white-space:pre-wrap;user-select:text;touch-action:pan-y;overscroll-behavior:contain}
    .card3d.front .reader-scroll{display:block}
    .card3d.front .preview{display:none}
    .card3d .meta{display:none;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .card3d.front .meta{display:grid}
    .mini{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--surfaceBorder)}
    .mini label{display:block;font-size:.66rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
    .mini span{font-size:.8rem}
    .card3d .actions{display:none;justify-content:flex-end}
    .card3d.front .actions{display:flex}
    .modalbg{position:fixed;inset:0;z-index:40;background:rgba(7,10,12,.66);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
    .modalbg.open{display:flex}
    .modal{width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:26px;background:var(--cardWash),var(--overlayBg);border:1px solid var(--surfaceBorder);padding:22px;user-select:text}
    .modal h2{font-family:var(--font-display);margin-bottom:12px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .field label{display:block;margin-bottom:6px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--surfaceBorder);background:var(--surface);font:inherit;color:inherit}
    .field textarea{min-height:140px}
    .span2{grid-column:span 2}
    .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    #hud{position:fixed;inset:auto 0 0 0;z-index:10;display:flex;justify-content:center;padding:16px;pointer-events:none}
    #minimap{position:fixed;left:0;top:64px;bottom:64px;z-index:9;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:8px;padding:10px;pointer-events:none}
    #minimap>*{pointer-events:auto}
    #mapToggle{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px}
    #mapBody{max-height:100%;max-width:180px;overflow:auto;border-radius:16px;border:1px solid var(--surfaceBorder);background:var(--surface);backdrop-filter:blur(10px);padding:6px}
    #minimap.collapsed #mapBody{display:none}
    #mapBody svg{display:block}
    #mapBody .edge{stroke:var(--faint);stroke-width:1.5;opacity:.45}
    #mapBody .edge.on{stroke:var(--primary);opacity:.9}
    #mapBody .node{fill:var(--surface);stroke:var(--faint);stroke-width:1.5;cursor:pointer}
    #mapBody .node.on{stroke:var(--primary)}
    #mapBody .node.cursor{fill:var(--primary);stroke:var(--primary)}
    #mapBody .node:hover{stroke:var(--text)}
    @media (prefers-reduced-motion: no-preference){#mapBody .node.cursor{animation:pulse 1.8s ease-in-out infinite}}
    @keyframes pulse{0%,100%{r:5}50%{r:7}}
    #overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(7,10,12,.7)}
    #overlay.open{display:flex}
    #overlay .box{max-width:420px;text-align:center;padding:28px;border-radius:24px;background:var(--overlayBg);border:1px solid var(--surfaceBorder)}
    #overlay h2{font-family:var(--font-display);margin-bottom:10px}
    #overlay p{color:var(--muted);margin-bottom:16px;line-height:1.55}
    .btn{padding:11px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
    .btn.primary{background:linear-gradient(180deg,rgba(96,215,210,.24),rgba(96,215,210,.12));border-color:rgba(96,215,210,.3)}
    #toast{position:fixed;right:16px;bottom:16px;z-index:50;display:none;max-width:360px;padding:13px 16px;border-radius:16px;background:var(--overlayBg);border:1px solid rgba(96,215,210,.26)}
    #toast.show{display:block}
    @media (prefers-reduced-motion: reduce){#scene{transition:none}#scene.bouncing,#stage.bounce::after{animation:none}.card3d{transition:none}}
  </style>
</head>
<body>
  <div id="chrome">
    <div class="cluster">
      <button class="pill" id="backBtn" title="Zoom out (Esc / right-click)">⤺</button>
      <span class="pill" id="crumb"><strong>All projects</strong></span>
      <span class="pill" id="levelName">Projects</span>
    </div>
    <div class="cluster">
      <span class="pill" id="position">—</span>
      <span class="pill" id="connState">Connecting…</span>
      <button class="pill" id="themeBtn" title="Toggle theme">◐</button>
      <a class="pill" href="/">Classic view</a>
    </div>
  </div>
  <div id="stage" data-level="projects"><div id="scene"><div id="drum"></div></div></div>
  <div id="hud"><span class="pill" id="hudHint">Scroll to spin · click a card to dive · right-click / Esc to zoom out · Ctrl+scroll zooms</span></div>
  <div id="minimap"><div id="mapBody"></div><button class="pill" id="mapToggle" title="Toggle the exploration map">Map 0^0</button></div>
  <div id="overlay"><div class="box"><h2>Bridge offline</h2><p id="overlayMsg">Could not reach the bridge. Start it with <code>node scripts/nd-mem-bridge-server.mjs</code> and retry.</p><button class="btn primary" id="retryBtn">Retry</button></div></div>
  <div class="modalbg" id="editModalBg">
    <div class="modal">
      <h2>Edit memory</h2>
      <div class="grid">
        <div class="field span2"><label>Content</label><textarea id="editContent"></textarea></div>
        <div class="field"><label>District</label><select id="editDistrict"></select></div>
        <div class="field"><label>Project (blank clears)</label><input id="editProject" /></div>
        <div class="field"><label>Visibility</label><select id="editVisibility"><option>private</option><option>shared</option><option>global</option></select></div>
        <div class="field"><label>Intensity (0–1)</label><input id="editIntensity" type="number" min="0" max="1" step="0.1" /></div>
        <div class="field"><label>Epistemic status</label><select id="editEpistemic"><option value="">(leave unchanged)</option><option value="draft">draft</option><option value="validated">validated</option><option value="outdated">outdated</option></select></div>
        <div class="field"><label>Tags (comma separated)</label><input id="editTags" /></div>
      </div>
      <div class="foot"><button class="btn" id="editCancelBtn">Cancel</button><button class="btn primary" id="editSaveBtn">Save changes</button></div>
    </div>
  </div>
  <div id="toast"></div>

  <script type="module">
    const BRIDGE = location.protocol.startsWith('http') ? location.origin : 'http://localhost:3737';
    const H = await import(BRIDGE + '/nd-mem-rolodex-helpers.mjs');
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const $ = s => document.querySelector(s);
    const els = { stage: $('#stage'), scene: $('#scene'), drum: $('#drum'), crumb: $('#crumb'), levelName: $('#levelName'), position: $('#position'), connState: $('#connState'), backBtn: $('#backBtn'), overlay: $('#overlay'), overlayMsg: $('#overlayMsg'), retryBtn: $('#retryBtn'), toast: $('#toast'), hudHint: $('#hudHint'), minimap: $('#minimap'), mapBody: $('#mapBody'), mapToggle: $('#mapToggle') };

    const state = {
      snapshot: { memories: {} },
      view: { level: 'projects', projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] },
      // Supersedes the history stack: the cursor's ancestor chain behaves
      // exactly as the stack did, and abandoned branches stay for the minimap.
      tree: H.createNavTree({ level: 'projects', projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] }),
      items: [],           // [{id, kind, data}] for the current drum
      rotation: 0,         // live continuous rotation (deg)
      velocity: 0,
      radius: 260,
      dragging: false,
      transitioning: false,
      frontIndex: -1,
      frontEl: null,        // the .card3d currently wearing .front, so updates touch two cards, not N
      stepTarget: null,     // arrow-key destination the tick loop eases toward (null = no step pending)
      gestureGain: 1,       // gesture degrees are scaled by this so a gesture moves a constant number of CARDS
      lastBounceAt: 0,
      editingId: null,
      editingDistrict: null, // district the edit modal was seeded with, to detect a real change
    };

    function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function showToast(msg){ els.toast.textContent = msg; els.toast.classList.add('show'); clearTimeout(showToast.t); showToast.t = setTimeout(() => els.toast.classList.remove('show'), 3200); }
    function fmt(v){ try { return new Date(v).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch { return '—'; } }

    function itemsForView(view){
      if (view.level === 'projects') return H.deriveProjects(state.snapshot).map(p => ({ id: p.id, kind: 'project', data: p }));
      if (view.level === 'districts') return H.deriveDistricts(state.snapshot, view.projectId).map(d => ({ id: d.id, kind: 'district', data: d }));
      return H.deriveMemories(state.snapshot, view.projectId, view.districtId).map(m => ({ id: m.id, kind: 'memory', data: m }));
    }

    function currentViewSnapshot(){
      return { ...state.view, centeredId: centeredItem()?.id ?? null, rotation: state.rotation, itemIds: state.items.map(i => i.id) };
    }
    function centeredItem(){ return state.frontIndex >= 0 ? state.items[state.frontIndex] : null; }

    function cardFace(item){
      const d = item.data;
      if (item.kind === 'project') return `<span class="kicker">Project</span><h2>${esc(d.id)}</h2><div class="chips"><span class="chip">${d.memoryCount} memories</span><span class="chip">${d.districtCount} district${d.districtCount === 1 ? '' : 's'}</span></div>`;
      if (item.kind === 'district') return `<span class="kicker">District</span><h2>${esc(d.id)}</h2><div class="chips"><span class="chip">${d.memoryCount} memories</span>${d.topTags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
      const metaRow = (label, value) => `<div class="mini"><label>${label}</label><span>${esc(value)}</span></div>`;
      // Content is deliberately NOT baked in twice (or in full) here. A real
      // bucket holds hundreds of memories of ~2KB each, and this string is
      // rebuilt on every SSE memory-change: emitting both copies cost ~1.25MB of
      // innerHTML per rebuild. The preview is clipped by overflow:hidden anyway
      // so 300 chars is more than the card can show, and the reader is filled by
      // updateFrontCard for the one card that is actually facing the camera.
      return `<span class="kicker">${esc(d.id)} · ${esc(d.district || 'uncategorized')}</span>`
        + `<h2>${esc(d.name || '(untitled)')}</h2>`
        + `<p class="preview">${esc(String(d.content ?? '').slice(0, 300))}</p>`
        + `<div class="reader-scroll"></div>`
        + `<div class="meta">${metaRow('Intensity', d.intensity ?? '—')}${metaRow('Visibility', d.visibility || 'private')}${metaRow('Created', fmt(d.created))}${metaRow('Tags', (d.tags || []).length)}</div>`
        + `<div class="chips">${(d.tags || []).slice(0, 4).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`
        + `<div class="actions"><button class="btn" data-edit="${esc(d.id)}">Edit</button></div>`;
    }

    function buildDrum(){
      state.items = itemsForView(state.view);
      const n = state.items.length;
      // The reader needs line length more than the drum needs uniformity: memory
      // cards widen (capped to the viewport) so a full meta stack still leaves
      // readable content. The CSS var and the radius math share this one number.
      const cardW = state.view.level === 'memories' ? Math.min(560, Math.round(window.innerWidth * 0.92)) : 340;
      els.stage.style.setProperty('--cardW', cardW + 'px');
      state.radius = H.drumRadius(cardW, n);
      els.stage.dataset.level = state.view.level;
      const theta = H.anglePerCard(n);
      // Gestures are authored in degrees, but a degree buys wildly different
      // amounts of travel depending on drum size: one card is 30deg at n=12 and
      // 0.99deg at n=364, so a fixed degree gain that feels right on a small
      // drum skips ~29 cards per wheel notch on a real one. Scale by the card
      // angle so a gesture moves a comparable number of CARDS instead. The
      // ceiling keeps 2-3 card drums from whipping past the item you aimed at;
      // the floor keeps a 364-card drum from needing 364 notches to lap it.
      state.gestureGain = Math.min(3, Math.max(0.2, theta / 30));
      state.stepTarget = null;
      if (!n) {
        // translateZ puts the placeholder on the camera plane, where real cards
        // sit; at z=0 it renders a drum-radius deep and reads as a recessed card.
        els.drum.innerHTML = `<div class="card3d front placeholder" style="transform:translateZ(${state.radius}px)"><span class="kicker">Empty</span><h2>${state.view.level === 'projects' ? 'No memories yet' : 'Nothing here'}</h2><p>Store a memory through MCP or the classic app and it will appear.</p></div>`;
        state.rotation = 0; state.velocity = 0; state.frontIndex = -1; state.frontEl = null;
        applyDrumTransform(); updateChrome(); return;
      }
      els.drum.innerHTML = state.items.map((item, i) =>
        `<div class="card3d" data-idx="${i}" style="transform:rotateY(${i * theta}deg) translateZ(${state.radius}px)">${cardFace(item)}</div>`).join('');
      const idx = Math.max(0, state.items.findIndex(i => i.id === state.view.centeredId));
      state.rotation = H.rotationForIndex(idx, n);
      state.velocity = 0;
      state.frontEl = null; // the old element is gone with the innerHTML it lived in
      applyDrumTransform();
      updateFrontCard(true);
    }

    function applyDrumTransform(){
      els.drum.style.transform = `translateZ(${-state.radius}px) rotateY(${state.rotation}deg)`;
    }

    // The reader's text lives on exactly one card at a time. Keeping it in the
    // markup of all N cards is what made a 364-memory drum unusable; textContent
    // also needs no escaping, unlike the innerHTML path cardFace has to use.
    function fillReader(el, text){
      const rs = el && el.querySelector('.reader-scroll'); // absent on project/district cards
      if (rs) rs.textContent = text;
    }

    function updateFrontCard(force = false){
      const n = state.items.length;
      const idx = H.nearestIndex(state.rotation, n);
      if (!force && idx === state.frontIndex) return;
      state.frontIndex = idx;
      // Cards are appended in item order, so children[idx] is the card for item idx.
      const next = idx >= 0 ? (els.drum.children[idx] ?? null) : null;
      if (force) {
        // buildDrum just rewrote the drum: every card needs its class settled.
        els.drum.querySelectorAll('.card3d').forEach((el, i) => el.classList.toggle('front', i === idx));
      } else if (state.frontEl !== next) {
        // Steady state touches two cards. Sweeping all N here ran once per front
        // change, i.e. many times a second during a spin, on every card.
        if (state.frontEl) { state.frontEl.classList.remove('front'); fillReader(state.frontEl, ''); }
        if (next) next.classList.add('front');
      }
      state.frontEl = next;
      fillReader(next, state.items[idx]?.data?.content ?? '');
      state.view.centeredId = centeredItem()?.id ?? null;
      updateChrome();
    }

    function depthNow(){ return H.navDepth(state.tree); }
    // The map is drawn from the tree itself, never from a parallel record, so
    // it cannot drift out of sync with where you can actually go. A layout
    // failure must not take navigation down with it — the rail hides instead.
    function renderMinimap(){
      els.mapToggle.textContent = `Map 0^${depthNow()}`;
      if (els.minimap.classList.contains('collapsed')) return;
      try {
        const laid = H.layoutNavTree(state.tree);
        const edges = laid.edges.map(e =>
          `<line class="edge${e.onPath ? ' on' : ''}" x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" />`).join('');
        const nodes = laid.nodes.map(n =>
          `<circle class="node${n.onPath ? ' on' : ''}${n.isCursor ? ' cursor' : ''}" data-node="${n.id}" cx="${n.x}" cy="${n.y}" r="5"><title>${esc(n.label)} (0^${n.depth})</title></circle>`).join('');
        els.mapBody.innerHTML = `<svg width="${laid.width}" height="${laid.height}" viewBox="0 0 ${laid.width} ${laid.height}">${edges}${nodes}</svg>`;
        els.mapBody.scrollTop = 0; // deepest row is at the top; keep the frontier in view
        els.mapBody.scrollLeft = els.mapBody.scrollWidth; // newest column (rightmost) is the frontier; keep it in view
      } catch (err) {
        console.error('minimap layout failed', err);
        els.minimap.style.display = 'none';
      }
    }
    function updateChrome(){
      const { level, projectId, districtId } = state.view;
      els.levelName.textContent = `${level[0].toUpperCase() + level.slice(1)} · 0^${depthNow()}`;
      // `0^N > project > district > card`: N answers "how deep", the path
      // answers "where", and each segment is a way back to that view.
      const segs = H.coordinateOf(state.view, depthNow(), centeredItem()?.id ?? null);
      els.crumb.innerHTML = segs.map((s, i) => {
        const sep = i ? '<span class="sep">&gt;</span>' : '';
        // A segment whose target is the view we're already standing in (the
        // rightmost non-leaf segment at districts/memories level) must be a
        // dead click just like the leaf — otherwise it's the most inviting
        // button on screen and does nothing but replay a 700ms zoom in place.
        const atCurrent = s.target
          && s.target.level === state.view.level
          && s.target.projectId === state.view.projectId
          && s.target.districtId === state.view.districtId;
        const jumpable = !atCurrent && (s.kind === 'depth' || s.target != null);
        return sep + `<button class="seg ${s.kind}" data-seg="${i}"${jumpable ? '' : ' disabled'}>${esc(s.text)}</button>`;
      }).join('');
      els.crumb.dataset.segments = JSON.stringify(segs.map(s => s.target));
      els.position.textContent = state.items.length ? `card ${state.frontIndex + 1} / ${state.items.length}` : '—';
      els.hudHint.textContent = level === 'memories'
        ? 'Scroll to spin · scroll inside the card to read · click to dive onward · right-click / Esc goes back'
        : 'Scroll to spin · click a card to dive · right-click / Esc to zoom out · Ctrl+scroll zooms';
      renderMinimap();
    }

    function stepBy(n){
      const count = state.items.length;
      if (!count || state.transitioning) return;
      const target = H.rotationForIndex(((state.frontIndex + n) % count + count) % count, count);
      const goal = state.rotation + H.shortestDelta(state.rotation, target);
      state.velocity = 0;
      // One card is ~1deg on a 364-card drum. Assigning the rotation outright
      // moved the drum by a hair in a single frame, which reads as "the arrow
      // keys do nothing"; easing to the same place is legible at any card angle.
      if (REDUCED) { state.stepTarget = null; state.rotation = goal; applyDrumTransform(); }
      else state.stepTarget = goal;
    }

    // ---------- dive / zoom out ----------
    const ZOOM_MS = 700;

    function transitionTo(view, dir){ // dir: 'in' pushes camera through the card, 'out' pulls it back
      state.transitioning = true;
      const enterCls = dir === 'in' ? 'zoom-in' : 'zoom-out';
      const exitCls = dir === 'in' ? 'zoom-out' : 'zoom-in';
      els.scene.classList.add(enterCls);
      setTimeout(() => {
        // state.transitioning is cleared by the inner timeout this body schedules,
        // so anything that throws before it (a buildDrum failure on a malformed
        // snapshot, say) would leave the flag stuck true — and every gesture,
        // tick() included, is gated on it. The page would look alive and ignore
        // all input until reload. Fail loud in the console, unstick the flag, and
        // leave the scene in its neutral pose.
        try {
          state.view = { ...view };
          buildDrum();
          // Jump to the exit pose with transitions off. A forced reflow alone is
          // not enough: it starts a transition toward the exit pose, and removing
          // the class one statement later cancels it a couple of percent in, so
          // the return would animate from the *enter* pose — backwards.
          els.scene.style.transition = 'none';
          els.scene.classList.remove(enterCls);
          els.scene.classList.add(exitCls);
          void els.scene.offsetWidth; // commit the exit pose with no transition running
          els.scene.style.transition = '';
          els.scene.classList.remove(exitCls); // now transitions exit pose -> identity
          setTimeout(() => { state.transitioning = false; }, REDUCED ? 0 : ZOOM_MS);
        } catch (err) {
          console.error(err);
          els.scene.style.transition = '';
          els.scene.classList.remove(enterCls, exitCls);
          state.transitioning = false;
        }
      }, REDUCED ? 0 : ZOOM_MS);
    }

    function dive(){
      if (state.transitioning || !state.items.length) return;
      const front = centeredItem();
      if (!front) return;
      // Record where we are leaving from before descending, so backing out
      // returns to this exact rotation and centered card.
      H.navSetCursorView(state.tree, currentViewSnapshot());
      const level = H.nextLevel(state.view.level);
      let next;
      if (state.view.level === 'projects') next = { level, projectId: front.id, districtId: null, centeredId: null, rotation: 0, itemIds: [] };
      else if (state.view.level === 'districts') next = { level, projectId: state.view.projectId, districtId: front.id, centeredId: null, rotation: 0, itemIds: [] };
      else next = { level, projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] }; // memories wraps to projects
      // The wrap is an ordinary child: one tree, one depth, no loop counter.
      H.navPush(state.tree, next);
      transitionTo(next, 'in');
    }

    function bounce(){
      const now = performance.now();
      if (now - state.lastBounceAt < 500) return;
      state.lastBounceAt = now;
      if (REDUCED) { showToast('This is the first view — nothing further back.'); return; }
      els.scene.classList.add('bouncing');
      els.stage.classList.add('bounce');
      setTimeout(() => { els.scene.classList.remove('bouncing'); els.stage.classList.remove('bounce'); }, 460);
    }

    function zoomOut(){
      if (state.transitioning) return;
      if (H.navAtWall(state.tree)) { bounce(); return; }
      // Keep this view current before leaving it, so re-diving here later
      // restores the card you were on rather than the one you arrived on.
      H.navSetCursorView(state.tree, currentViewSnapshot());
      const restored = H.navReconcileBack(state.tree, state.snapshot);
      if (!restored) {
        transitionTo({ level: 'projects', projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] }, 'out');
        showToast('Earlier views no longer exist — back to all projects.');
        return;
      }
      transitionTo(restored, 'out');
    }

    // One animated hop, however far back the target is — replaying a
    // transition per level would make a seven-deep jump take ten seconds.
    function jumpToNode(nodeId){
      if (state.transitioning) return;
      H.navSetCursorView(state.tree, currentViewSnapshot());
      const view = H.navReconcileJump(state.tree, nodeId, state.snapshot);
      if (!view) {
        // navReconcileJump leaves the cursor node untouched when nodeId doesn't
        // resolve (an unknown id), so without this the tree cursor could still
        // be deep while we show "All projects" — the coordinate would read a
        // nonzero depth over that view. Walk the cursor home to match; this is
        // a no-op if navReconcileBack already reached the wall.
        while (!H.navAtWall(state.tree)) H.navBack(state.tree);
        transitionTo({ level: 'projects', projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] }, 'out');
        showToast('That view no longer exists — back to all projects.');
        return;
      }
      transitionTo(view, 'out');
    }

    els.crumb.addEventListener('click', (e) => {
      const btn = e.target instanceof Element ? e.target.closest('.seg') : null;
      if (!btn || btn.disabled || state.transitioning) return;
      const targets = JSON.parse(els.crumb.dataset.segments || '[]');
      const target = targets[Number(btn.dataset.seg)];
      if (target === null || target === undefined) {
        // The depth badge is the origin: go all the way home.
        if (btn.classList.contains('depth') && !H.navAtWall(state.tree)) jumpToNode(0);
        return;
      }
      const nodeId = H.navFindContext(state.tree, target);
      if (nodeId === null) { showToast('That step is not on the path you walked.'); return; }
      jumpToNode(nodeId);
    });

    els.mapBody.addEventListener('click', (e) => {
      const circle = e.target instanceof Element ? e.target.closest('[data-node]') : null;
      if (!circle) return;
      const id = Number(circle.dataset.node);
      if (id === state.tree.cursor) return;
      jumpToNode(id);
    });
    const MAP_KEY = 'ndmem.rolodex.minimap';
    els.mapToggle.addEventListener('click', () => {
      const collapsed = els.minimap.classList.toggle('collapsed');
      try { localStorage.setItem(MAP_KEY, collapsed ? 'collapsed' : 'open'); } catch {}
      renderMinimap();
    });
    try { if (localStorage.getItem(MAP_KEY) === 'collapsed') els.minimap.classList.add('collapsed'); } catch {}

    // ---------- animation loop ----------
    function tick(){
      if (!state.transitioning && !state.dragging && state.items.length) {
        if (state.stepTarget != null) {
          const d = state.stepTarget - state.rotation;
          if (Math.abs(d) > 0.05) state.rotation += d * 0.14;
          else { state.rotation = state.stepTarget; state.stepTarget = null; }
        } else if (Math.abs(state.velocity) > 0.02) {
          state.rotation += state.velocity;
          state.velocity *= 0.93;
        } else {
          state.velocity = 0;
          const target = H.snapTarget(state.rotation, state.items.length);
          const d = target - state.rotation;
          if (Math.abs(d) > 0.05) state.rotation += REDUCED ? d : d * 0.14;
          else state.rotation = target;
        }
        applyDrumTransform();
        updateFrontCard();
      }
      requestAnimationFrame(tick);
    }

    // ---------- input: wheel ----------
    function insideReader(target){
      if (state.view.level !== 'memories' || !(target instanceof Element)) return false;
      // A reader with nothing to scroll must not swallow the wheel: short
      // memories would otherwise sit in a dead zone the size of the front card,
      // where scrolling does nothing at all.
      const el = target.closest('.reader-scroll');
      return !!el && el.scrollHeight > el.clientHeight;
    }
    els.stage.addEventListener('wheel', (e) => {
      // deltaMode 1 = lines, 2 = pages. Firefox reports line deltas for real
      // mouse wheels, which are ~50x smaller than the pixel deltas this spin
      // rate assumes, so normalize to pixels before using deltaY for anything.
      const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? window.innerHeight : 1);
      if (e.ctrlKey) {
        e.preventDefault();
        (H.routeGesture(dy < 0 ? 'ctrlWheelUp' : 'ctrlWheelDown', ctx(e)) === 'dive' ? dive : zoomOut)();
        return;
      }
      const action = H.routeGesture('wheel', ctx(e));
      if (action === 'scrollContent') return; // native scroll of the reader div
      e.preventDefault();
      // preventDefault stays above this guard so the page never scrolls or
      // zooms mid-transition. Banking velocity here would not: tick() is gated
      // while transitioning, so notches spun over the ~700ms the new drum is
      // already visible would all release at once as a multi-card lurch.
      if (state.transitioning) return;
      state.stepTarget = null; // a live gesture outranks a pending arrow step
      state.velocity = Math.max(-30, Math.min(30, state.velocity + dy * 0.02 * state.gestureGain));
    }, { passive: false });
    function ctx(e){ return { level: state.view.level, insideReader: insideReader(e.target) }; }
    // The stage covers most of the window but not the chrome bar or the HUD, and
    // Ctrl+wheel there browser-zooms the whole app — which a fixed-position 3D
    // scene does not survive gracefully. Suppress it document-wide (the modal is
    // exempt: zooming a text form is legitimate). The stage's own handler still
    // runs and preventDefaults again; calling it twice is harmless.
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey && !document.querySelector('.modalbg.open')) e.preventDefault();
    }, { passive: false });

    // ---------- input: pointer (drag spin, pinch, long-press) ----------
    const pointers = new Map();
    let pinchStart = 0, dragMoved = 0;
    let pressTarget = null;        // pointerdown's target: the browser's real 3D hit-test
    let dragOrigin = { x: 0, y: 0 };
    els.stage.addEventListener('pointerdown', (e) => {
      // Capture so a drag that wanders over the fixed chrome bar (or off the
      // window) keeps delivering pointermove/pointerup to the stage. Without it
      // the release is never seen and state.dragging stays stuck true.
      try { els.stage.setPointerCapture(e.pointerId); } catch {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      } else if (pointers.size === 1) {
        dragMoved = 0;
        dragOrigin = { x: e.clientX, y: e.clientY };
        // Kept for the click handler: pointer capture retargets the click to
        // #stage, and this preserves what the press actually landed on for
        // the elements Chromium CAN hit-test (the flat front card and its
        // buttons). Rotated side cards are invisible to hit-testing entirely
        // — events and elementFromPoint both report #scene — and resolve
        // geometrically in cardIndexAtPoint instead.
        pressTarget = e.target instanceof Element ? e.target : null;
        // A horizontal drag spins at every level, reader included (spec: hdrag ->
        // spin). Only a mouse is exempt inside the reader, where press-and-drag is
        // how text gets selected; touch has no such conflict — it scrolls the
        // reader vertically via touch-action:pan-y and spins horizontally here.
        if (!insideReader(e.target) || e.pointerType !== 'mouse') { state.dragging = true; state.velocity = 0; state.stepTarget = null; }
      }
    });
    els.stage.addEventListener('pointermove', (e) => {
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && pinchStart > 0) {
        const [a, b] = [...pointers.values()];
        const ratio = Math.hypot(a.x - b.x, a.y - b.y) / pinchStart;
        if (ratio > 1.25) { pinchStart = 0; dive(); }
        else if (ratio < 0.8) { pinchStart = 0; zoomOut(); }
        return;
      }
      if (state.dragging) {
        // Net displacement from the press origin — NOT accumulated path
        // length. Pointer capture delivers every sub-pixel wobble of a human
        // click, and summing |dx|+|dy| across those events crossed the click
        // threshold on jitter alone, silently eating clicks "at random". The
        // max is sticky, and tracked above the guard below, so a drag that
        // swings out and back (or was refused mid-transition) still
        // suppresses the click it ends with.
        dragMoved = Math.max(dragMoved, Math.abs(e.clientX - dragOrigin.x) + Math.abs(e.clientY - dragOrigin.y));
        // Mirror the wheel's transition guard: a drag mid-zoom rotates the drum
        // the swap is about to replace, and banks a velocity that releases into
        // the new view as a lurch. The placeholder has no drum to spin at all.
        if (state.transitioning || !state.items.length) return;
        const spin = dx * 0.22 * state.gestureGain;
        state.rotation += spin;
        state.velocity = Math.max(-30, Math.min(30, spin)); // same rail as the wheel
        applyDrumTransform();
        updateFrontCard();
      }
    });
    function releasePointer(e){
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = 0;
      if (!pointers.size) state.dragging = false;
    }
    // Bound to window, not the stage: a release outside the stage must still
    // clear state.dragging, or tick() short-circuits forever and the drum
    // freezes until reload. lostpointercapture covers capture stolen by the UA.
    window.addEventListener('pointerup', releasePointer);
    window.addEventListener('pointercancel', releasePointer);
    window.addEventListener('lostpointercapture', releasePointer);

    // ---------- input: click, context menu, keys ----------
    // Chromium's hit-testing — pointer events AND elementFromPoint — misses
    // the rotated drum cards entirely: both report #scene for every non-front
    // card, so no DOM path can resolve a side-card click. This projects each
    // card's face with the same numbers the renderer uses (drum rotation,
    // radius, card size, stage perspective) and finds the frontmost face
    // containing the point. Exact for the horizontal extent (both edges are
    // projected); the vertical band uses the larger edge scale, which is
    // slightly generous at strong angles and errs toward accepting clicks.
    const PERSPECTIVE = 1400; // keep in sync with #stage{perspective:1400px}
    function cardIndexAtPoint(clientX, clientY){
      const n = state.items.length;
      if (!n) return -1;
      const rect = els.stage.getBoundingClientRect();
      const originX = rect.left + rect.width / 2, originY = rect.top + rect.height / 2;
      const styles = getComputedStyle(els.stage);
      const cardW = parseFloat(styles.getPropertyValue('--cardW')) || 340;
      const cardH = parseFloat(styles.getPropertyValue('--cardH')) || 230;
      const theta = H.anglePerCard(n);
      // Screen position + depth of the point localX along card face at angle a:
      // the card transform is rotateY(a) translateZ(radius) inside a drum at
      // translateZ(-radius), so (localX, 0, 0) lands at the coordinates below.
      const project = (localX, a) => {
        const sin = Math.sin(a), cos = Math.cos(a);
        const x = localX * cos + state.radius * sin;
        const z = -localX * sin + state.radius * cos - state.radius; // toward viewer, <= 0
        const s = PERSPECTIVE / (PERSPECTIVE - z);
        return { sx: originX + x * s, s, z };
      };
      let best = -1, bestZ = -Infinity;
      for (let i = 0; i < n; i++) {
        const a = (state.rotation + i * theta) * Math.PI / 180;
        if (Math.cos(a) <= 0.05) continue; // facing away or edge-on: not clickable
        const L = project(-cardW / 2, a), R = project(cardW / 2, a);
        const lo = Math.min(L.sx, R.sx), hi = Math.max(L.sx, R.sx);
        const halfH = (cardH / 2) * Math.max(L.s, R.s);
        const centerZ = (L.z + R.z) / 2;
        if (clientX >= lo && clientX <= hi && Math.abs(clientY - originY) <= halfH && centerZ > bestZ) {
          best = i; bestZ = centerZ;
        }
      }
      return best;
    }
    els.stage.addEventListener('click', (e) => {
      if (dragMoved > 8 || state.transitioning) return; // a drag, not a click
      // DOM resolution first — it works for the flat front card and carries
      // the button guard — then the geometric fallback for the side
      // cards Chromium cannot hit-test. pressTarget survives the capture
      // retargeting; isConnected covers a drum rebuilt (SSE) mid-press.
      let hit = (pressTarget && pressTarget.isConnected) ? pressTarget
        : (e.target instanceof Element ? e.target : null);
      if (!hit || !hit.closest('.card3d[data-idx]')) {
        const under = document.elementFromPoint(e.clientX, e.clientY);
        if (under instanceof Element && under.closest('.card3d[data-idx]')) hit = under;
      }
      // `.reader-scroll` is deliberately NOT exempt any more: clicking the
      // memory text dives onward like clicking anywhere else on the card.
      // Reading is still safe — wheel-inside-the-reader scrolls (see
      // insideReader), and a text-selection drag exceeds the click threshold
      // and suppresses its own click.
      if (hit && hit.closest('button, a')) return;
      const card = hit ? hit.closest('.card3d[data-idx]') : null;
      const idx = card ? Number(card.dataset.idx) : cardIndexAtPoint(e.clientX, e.clientY);
      if (idx < 0) return;
      const kind = idx === state.frontIndex ? 'clickCentered' : 'clickOther';
      const action = H.routeGesture(kind, { level: state.view.level, insideReader: false });
      if (action === 'none') return;
      if (idx !== state.frontIndex) {
        const target = H.rotationForIndex(idx, state.items.length);
        state.rotation += H.shortestDelta(state.rotation, target);
        state.velocity = 0;
        state.stepTarget = null; // centering on a clicked card overrides a pending arrow step
        applyDrumTransform(); updateFrontCard();
      }
      if (action === 'dive' || action === 'centerThenDive') dive();
    });
    window.addEventListener('contextmenu', (e) => {
      if (document.querySelector('.modalbg.open')) return; // modal text fields keep the native menu
      e.preventDefault();
      if (!state.transitioning) zoomOut();
    });
    $('#themeBtn').addEventListener('click', () => document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    window.addEventListener('keydown', (e) => {
      // A text field owns every key it receives. A focused link or button only
      // owns its activation keys — bailing on all of them meant that once the
      // theme toggle or ⤺ button had focus (i.e. right after clicking one), Esc,
      // Backspace and the arrows stopped driving the drum entirely.
      const t = e.target instanceof Element ? e.target : null;
      if (t && t.closest('input, textarea, select')) return;
      if (t && t.closest('a, button') && (e.key === 'Enter' || e.key === ' ')) return;
      const openModal = document.querySelector('.modalbg.open');
      if (openModal) { if (e.key === 'Escape') openModal.classList.remove('open'); return; }
      const map = { Escape: 'esc', Backspace: 'back', ArrowLeft: 'arrowLeft', ArrowRight: 'arrowRight', Enter: 'enter' };
      const kind = map[e.key];
      if (!kind) return;
      e.preventDefault();
      const action = H.routeGesture(kind, { level: state.view.level, insideReader: false });
      if (action === 'zoomOut') zoomOut();
      else if (action === 'dive') dive();
      else if (action === 'stepPrev') stepBy(-1);
      else if (action === 'stepNext') stepBy(1);
    });
    els.backBtn.addEventListener('click', () => zoomOut());

    // ---------- edit modal ----------
    const CANONICAL = H.CANONICAL_DISTRICTS;
    function openEditModal(m){
      state.editingId = m.id;
      const districts = CANONICAL.includes(m.district) || !m.district ? CANONICAL : [m.district, ...CANONICAL];
      $('#editDistrict').innerHTML = districts.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
      $('#editContent').value = m.content || '';
      $('#editDistrict').value = m.district || 'practical_execution';
      $('#editProject').value = m.project_id ?? '';
      $('#editVisibility').value = m.visibility || 'private';
      $('#editIntensity').value = m.intensity ?? 0.5;
      $('#editEpistemic').value = ['draft', 'validated', 'outdated'].includes(m.epistemic_status) ? m.epistemic_status : '';
      $('#editTags').value = (m.tags || []).join(', ');
      // Remember what the select was seeded with, not m.district: a district-less
      // memory is *displayed* as practical_execution, and submitting that value
      // unchanged would silently refile it. Only a real edit differs from this.
      state.editingDistrict = $('#editDistrict').value;
      $('#editModalBg').classList.add('open');
      $('#editContent').focus(); // must follow .open — a display:none field cannot take focus
    }
    async function submitEdit(){
      const content = $('#editContent').value.trim();
      if (!content) { showToast('Content cannot be empty.'); return; }
      const project = $('#editProject').value.trim();
      const body = {
        memoryId: state.editingId,
        content,
        visibility: $('#editVisibility').value,
        projectId: project === '' ? null : project,
        tags: $('#editTags').value.split(',').map(s => s.trim()).filter(Boolean),
      };
      // The bridge forwards only the keys present, leaving everything else
      // untouched, so an untouched control must send nothing. An emptied number
      // field reads as '' and would post intensity: NaN; an unchanged district
      // select would post the placeholder value shown for district-less memories.
      const intensity = $('#editIntensity').value.trim();
      if (intensity !== '') body.intensity = Number(intensity);
      const district = $('#editDistrict').value;
      if (district !== state.editingDistrict) body.district = district;
      const epistemic = $('#editEpistemic').value;
      if (epistemic) body.epistemicStatus = epistemic;
      try {
        const res = await fetch(`${BRIDGE}/update`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error('update failed');
        $('#editModalBg').classList.remove('open');
        showToast('Update routed through the bridge.');
        // The snapshot is otherwise only fetched at init, so both the card and a
        // reopened modal would keep showing pre-edit values — and a second edit of
        // the same memory would re-POST that stale content, silently reverting the
        // first. This runs last so a reconcile toast ("centered card was removed",
        // "this view emptied") lands after the success toast and survives, instead
        // of being overwritten by it. Refresh failure is caught separately: the
        // save already succeeded, so a stale card is acceptable but a stuck modal
        // (or a false failure toast from the outer catch) is not.
        try { await loadSnapshot(); refreshAndReconcile(); } catch {}
      } catch {
        showToast('Update failed — the modal is untouched, fix and retry.');
      }
    }
    els.stage.addEventListener('click', (e) => {
      if (dragMoved > 8 || state.transitioning) return; // a drag-spin that ended over the button, not a click
      // Same retargeting caveat as the card handler above: the pointerdown's
      // target is the real hit; elementFromPoint only as a last resort (the
      // Edit button lives on the flat front card, where it does still work).
      let hit = (pressTarget && pressTarget.isConnected) ? pressTarget
        : (e.target instanceof Element ? e.target : null);
      if (!hit || !hit.closest('[data-edit]')) {
        const under = document.elementFromPoint(e.clientX, e.clientY);
        if (under instanceof Element) hit = under;
      }
      const btn = hit ? hit.closest('[data-edit]') : null;
      if (!btn) return;
      const m = H.deriveMemories(state.snapshot, state.view.projectId, state.view.districtId).find(x => x.id === btn.dataset.edit);
      if (m) openEditModal(m);
    });
    $('#editCancelBtn').addEventListener('click', () => $('#editModalBg').classList.remove('open'));
    $('#editSaveBtn').addEventListener('click', submitEdit);
    $('#editModalBg').addEventListener('click', (e) => { if (e.target.id === 'editModalBg') $('#editModalBg').classList.remove('open'); });
    // Esc has to close the modal from inside it too: the window handler bails
    // out for any focused field, and the modal opens with the textarea focused.
    // stopPropagation keeps that handler from seeing an already-closed modal
    // and treating the same Esc as a zoom-out.
    $('#editModalBg').addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      e.stopPropagation();
      $('#editModalBg').classList.remove('open');
    });

    // ---------- data ----------
    async function loadSnapshot(){
      const res = await fetch(`${BRIDGE}/memories`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.snapshot = await res.json();
    }
    async function init(){
      try {
        const health = await (await fetch(`${BRIDGE}/health`)).json();
        await loadSnapshot();
        els.connState.textContent = `Bridge :${health.port}`;
        els.overlay.classList.remove('open');
        // Retry runs init() again after the bridge came back, possibly against a
        // store that moved on. Reconciling (rather than rebuilding blind) keeps
        // the level, history and centered card the user left behind.
        refreshAndReconcile();
      } catch {
        els.connState.textContent = 'Offline';
        els.overlay.classList.add('open');
      }
    }
    // ---------- live refresh (spec: preserve level, rotation, history, centered-by-id) ----------
    // Every path that reloads the snapshot reconciles through here rather than
    // calling buildDrum() directly: if the centered item has left the view,
    // buildDrum's `Math.max(0, findIndex(...))` silently re-centers on card 0 and
    // updateFrontCard rewrites view.centeredId, so neighbor selection and its
    // toast are skipped — and the SSE pass that follows a local save would then
    // find an already-valid centeredId and report 'kept'. Exactly two bare
    // buildDrum() calls are deliberate: transitionTo's midpoint view-swap (the
    // view is brand new, there is no prior centering to preserve) and this
    // function's own transitioning branch (that swap owns the view; reconciling
    // against the outgoing one would fight it). Callers own the await on
    // loadSnapshot(); this stays synchronous so it cannot interleave.
    function refreshAndReconcile(){
      if (state.transitioning) { buildDrum(); return; }
      const prevIds = state.items.map(i => i.id);
      const before = currentViewSnapshot();
      // A cold load, a Retry and an SSE hello-resync all reconcile from an empty
      // drum with no centered card. Nothing was removed and nothing emptied —
      // there was never anything on screen — so both toasts need a real prior
      // drum (and, for the neighbor case, a real prior centering) to report on.
      const hadItems = prevIds.length > 0;
      const hadCentered = hadItems && before.centeredId != null;
      const result = H.reconcileView(before, prevIds, state.snapshot);
      if (result.status === 'invalid') {
        const restored = H.navReconcileBack(state.tree, state.snapshot);
        state.view = restored ?? { level: 'projects', projectId: null, districtId: null, centeredId: null, rotation: 0, itemIds: [] };
        if (hadItems) showToast(restored ? 'This view emptied — zoomed out to the last valid one.' : 'This view emptied — back to all projects.');
      } else {
        state.view = result.view;
        H.navSetCursorView(state.tree, result.view);
        if (result.status === 'neighbor' && hadCentered) showToast('The centered card was removed — showing its neighbor.');
      }
      buildDrum();
    }

    function connectEvents(){
      const es = new EventSource(`${BRIDGE}/events`);
      es.addEventListener('memory-change', async () => {
        try { await loadSnapshot(); } catch { return; }
        refreshAndReconcile();
      });
      es.onerror = () => { els.connState.textContent = 'Stream lost — retrying…'; };
      // hello also fires on every reconnect, and memory-change events raised while
      // the stream was down were never delivered, so the page would sit on a stale
      // snapshot that nothing else refetches. Resync on every hello.
      es.addEventListener('hello', async () => {
        els.connState.textContent = 'Live';
        try { await loadSnapshot(); refreshAndReconcile(); } catch {}
      });
    }
    connectEvents();
    els.retryBtn.addEventListener('click', init);
    await init();
    tick();
  </script>
</body>
</html>
